name: Refresh Herald rules

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RS_REPO: reviewer-selector
  TARGET_OWNER: mozilla-conduit
  FORK_OWNER: shtrom
  REFRESH_BRANCH: herald-rules-refresh

jobs:
  refresh-rules:
    name: Refresh rules from Phabricator
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Install a specific version of uv.
          version: "0.11.3"

      - name: Check out herald_crawler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: uv sync

      - name: Run herald-scraper
        env:
          REDASH_API_KEY: ${{ secrets.REDASH_API_KEY }}
        run: |
          curl -L https://raw.githubusercontent.com/mozilla-conduit/reviewer-selector/refs/heads/main/herald_rules.json -o herald_rules.orig.json
          uv run herald-scraper \
            --url https://phabricator.services.mozilla.com \
            --stmo-api-key "${REDASH_API_KEY}" \
            --no-resolve-github \
            --input herald_rules.orig.json \
            --output herald_rules.json

      - name: Save new rules
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: herald_rules.json
          path: herald_rules.json
          # Keep for a bit more than two update cycles.
          retention-days: 16

  commit-rules:
    name: Commit rules in reviewer-selector
    needs: refresh-rules
    runs-on: ubuntu-latest
    steps:
      - name: Download new rules
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: herald_rules.json

      - name: Check out reviewer-selector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "${{ env.TARGET_OWNER }}/${{ env.RS_REPO}}"
          # Use the fork's token so auth is set-up to push to it.
          token: ${{ secrets.FORK_GH_TOKEN }}
          path: reviewer-selector
          persist-credentials: true

      - name: Commit and push refreshed herald_rules.json
        working-directory: reviewer-selector
        run: |
          cp ../herald_rules.json herald_rules.json
          git config user.name "herald-crawler-bot"
          git config user.email "conduit-team+herald-crawler-bot@mozilla.com"
          git checkout -B "${REFRESH_BRANCH}"
          git add herald_rules.json
          git commit -m "herald_rules: update $(date +%Y-%m-%d) (bug 2048101)"
          git remote add work "https://github.com/${FORK_REPO}"
          git push --force work "${REFRESH_BRANCH}"

      - name: Open or update pull request
        working-directory: reviewer-selector
        env:
          GH_TOKEN: ${{ secrets.REVIEWER_SELECTOR_GH_TOKEN }}
        run: |
          if [ -z "$(gh pr list --repo "${TARGET_OWNER}/${RS_REPO}" \
                      --head "${FORK_OWNER}:${REFRESH_BRANCH}" \
                      --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --repo "${TARGET_OWNER}/${RS_REPO}" \
              --head "${FORK_OWNER}:${REFRESH_BRANCH}" \
              --title "herald_rules: update $(date +%Y-%m-%d) (bug 2048101)" \
              --body "Automated refresh of herald_rules.json by herald_crawler's scheduled workflow."
          fi

